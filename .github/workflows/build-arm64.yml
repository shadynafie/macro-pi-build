name: Build Macro for Raspberry Pi (arm64)

# Builds the latest macro-inc/macro service binaries for aarch64-linux and
# publishes them as a Nix binary cache in a GitHub Release. The Pi downloads
# the newest release and imports it with `nix copy`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "macro-inc/macro tag, branch or commit (default: their latest production release)"
        default: latest-release
  schedule:
    - cron: "0 22 * * 0" # Sundays 10 pm UTC

permissions:
  contents: write

concurrency:
  group: build-arm64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Clone Macro
        shell: bash
        id: src
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ inputs.ref || 'latest-release' }}"
          if [ "$ref" = "latest-release" ]; then
            # Macro tags each production release (vYYYY.MM.DD.N): build what macro.com runs.
            ref="$(gh release view -R macro-inc/macro --json tagName -q .tagName)"
          fi
          echo "Building macro-inc/macro @ $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          git clone --filter=blob:none https://github.com/macro-inc/macro.git src
          cd src
          git checkout "$ref"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Skip if this commit is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName' | grep -q -- "-${{ steps.src.outputs.short }}$"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built macro@${{ steps.src.outputs.short }}"
          fi

      - name: Install Nix
        if: steps.check.outputs.skip != 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      # Macro pins its bun node_modules hash only for x86_64-linux and
      # aarch64-darwin. Add an aarch64-linux entry (placeholder first), let Nix
      # report the real hash, write it in, and build again.
      - name: Build service binaries
        if: steps.check.outputs.skip != 'true'
        working-directory: src
        shell: bash
        run: |
          set -uo pipefail
          hashes=nix-support/node_modules-hashes.json
          if ! jq -e '.nodeModules["aarch64-linux"]' "$hashes" >/dev/null; then
            jq '.nodeModules["aarch64-linux"] = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="' "$hashes" > "$hashes.new" && mv "$hashes.new" "$hashes"
          fi
          git add -A >/dev/null
          for attempt in 1 2 3 4; do
            echo "::group::nix build attempt $attempt"
            nix build .#local-stack-binaries --out-link ../bins -L > ../build.log 2>&1
            rc=$?
            tail -n 300 ../build.log
            echo "::endgroup::"
            [ $rc -eq 0 ] && break
            spec=$(grep -oP 'specified:\s+\Ksha256-\S+' ../build.log | head -1 || true)
            got=$(grep -oP 'got:\s+\Ksha256-\S+' ../build.log | head -1 || true)
            if [ -n "$spec" ] && [ -n "$got" ]; then
              echo "Fixed-output hash mismatch: $spec -> $got"
              grep -rlF "$spec" nix nix-support | xargs sed -i "s|$spec|$got|g"
              git add -A >/dev/null
              continue
            fi
            echo "::error::nix build failed (not a hash mismatch)"
            grep -E "^error|error:" ../build.log | tail -n 20
            exit 1
          done
          [ -e ../bins ] || { echo "::error::no build output"; exit 1; }
          readlink -f ../bins
          ls -la ../bins/bin | head -60
          git diff --cached --stat

      - name: Export Nix closure
        shell: bash
        if: steps.check.outputs.skip != 'true'
        run: |
          out="$(readlink -f bins)"
          nix path-info -rSh "$out" | sort -k2 -h | tail -n 15
          nix copy --to "file://$PWD/nixcache?compression=zstd" "$out"
          echo "$out" > store-path.txt
          echo "${{ steps.src.outputs.sha }}" > macro-commit.txt
          tar -cf - -C nixcache . | split -b 1900M - closure.tar.part-
          ls -lh closure.tar.part-* store-path.txt

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ steps.src.outputs.date }}-${{ steps.src.outputs.short }}"
          gh release create "$tag" closure.tar.part-* store-path.txt macro-commit.txt \
            -R "$GITHUB_REPOSITORY" \
            --title "Macro ${{ steps.src.outputs.ref }} (arm64)" \
            --notes "Built from macro-inc/macro ${{ steps.src.outputs.ref }} (${{ steps.src.outputs.sha }}) for aarch64-linux."
